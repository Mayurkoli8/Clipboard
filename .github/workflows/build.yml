name: Build ClipSync APK + Windows EXE
on: [push]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyinstaller pyperclip websocket-client Pillow pystray
      - name: Build Windows EXE
        working-directory: desktop
        run: pyinstaller --onefile --windowed --name ClipSync --hidden-import websocket --hidden-import pystray._win32 --hidden-import PIL._tkinter_finder app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Windows-EXE
          path: desktop/dist/ClipSync.exe
          retention-days: 30